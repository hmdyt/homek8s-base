apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: mimir-distributed
    targetRevision: 5.8.0
    helm:
      valuesObject:
        fullnameOverride: mimir
        mimir:
          structuredConfig:
            common:
              storage:
                backend: s3
                s3:
                  endpoint: seaweedfs-filer.seaweedfs.svc.cluster.local:8333
                  region: us-east-1
                  insecure: true
                  access_key_id: dummy
                  secret_access_key: dummy
                  send_content_md5: true
                  http:
                    insecure_skip_verify: true
                    idle_conn_timeout: 90s
                    response_header_timeout: 2m
                    tls_handshake_timeout: 10s
                    expect_continue_timeout: 10s
            blocks_storage:
              s3:
                bucket_name: mimir-blocks
              tsdb:
                dir: /data/tsdb
                head_compaction_interval: 15m
              bucket_store:
                sync_dir: /data/tsdb-sync
            ruler_storage:
              s3:
                bucket_name: mimir-ruler
            alertmanager_storage:
              s3:
                bucket_name: mimir-alertmanager
            limits:
              native_histograms_ingestion_enabled: true
              max_global_series_per_user: 500000
              out_of_order_time_window: 5m
              compactor_blocks_retention_period: 30d
              ingestion_rate: 30000
              ingestion_burst_size: 300000
            multitenancy_enabled: false
            ingester:
              ring:
                replication_factor: 1
        minio:
          enabled: false
        alertmanager:
          enabled: true
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          persistentVolume:
            enabled: true
            storageClass: local-path
            size: 1Gi
        distributor:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
        ingester:
          replicas: 1
          zoneAwareReplication:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1.5"
              memory: 1536Mi
          persistentVolume:
            enabled: true
            storageClass: local-path
            size: 5Gi
        store_gateway:
          replicas: 1
          zoneAwareReplication:
            enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          persistentVolume:
            enabled: true
            storageClass: local-path
            size: 2Gi
        compactor:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          persistentVolume:
            enabled: true
            storageClass: local-path
            size: 5Gi
        querier:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
        query_frontend:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
        query_scheduler:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        ruler:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        overrides_exporter:
          replicas: 1
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        nginx:
          service:
            type: ClusterIP
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - host: mimir.homek8s-base.local
                paths:
                  - path: /
                    pathType: Prefix
          replicas: 1
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        chunks-cache:
          enabled: false
        index-cache:
          enabled: false
        metadata-cache:
          enabled: false
        results-cache:
          enabled: false
        rollout_operator:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: mimir
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
