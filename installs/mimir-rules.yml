apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir-rules
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hmdyt/homek8s-base.git
    path: mimir
    targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: mimir
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
