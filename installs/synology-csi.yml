apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: synology-csi
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/SynologyOpenSource/synology-csi.git
      # v1.4.0 の release はあるが Docker Hub に synology/synology-csi:v1.4.0 が publish されていない
      # （Hub は v1.3.1 まで）。main を追うと ImagePullBackOff で CSI が起動しないため固定する。
      targetRevision: v1.4.0
      path: deploy/kubernetes/v1.20
      directory:
        recurse: false
    - repoURL: https://github.com/hmdyt/homek8s-base.git
      targetRevision: main
      path: installs/synology-csi
  destination:
    server: https://kubernetes.default.svc
    namespace: synology-csi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
