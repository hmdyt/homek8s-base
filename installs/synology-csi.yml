apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: synology-csi
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/SynologyOpenSource/synology-csi.git
      # v1.4.0 の tag はあるが Docker Hub に synology/synology-csi:v1.4.0 が publish されていない
      # （Hub は v1.3.1 まで）。v1.4.0 に上げると csi-plugin が ImagePullBackOff で起動せず、
      # iSCSI ボリュームの unstage ができないため Pod の削除も止まる。renovate.json で更新を止めてある。
      targetRevision: v1.3.1
      path: deploy/kubernetes/v1.20
      directory:
        recurse: false
    - repoURL: https://github.com/hmdyt/homek8s-base.git
      targetRevision: main
      path: installs/synology-csi
  destination:
    server: https://kubernetes.default.svc
    namespace: synology-csi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
