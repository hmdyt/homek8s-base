apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.27.0
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          structuredConfig:
            memberlist:
              join_members: []
            common:
              ring:
                kvstore:
                  store: inmemory
            ingester:
              lifecycler:
                ring:
                  kvstore:
                    store: inmemory
            distributor:
              ring:
                kvstore:
                  store: inmemory
            query_scheduler:
              scheduler_ring:
                kvstore:
                  store: inmemory
            compactor:
              compactor_ring:
                kvstore:
                  store: inmemory
            ruler:
              ring:
                kvstore:
                  store: inmemory
              remote_write:
                enabled: true
                clients:
                  mimir:
                    url: http://mimir-nginx.mimir.svc.cluster.local:80/api/v1/push
                    headers:
                      X-Scope-OrgID: anonymous
            index_gateway:
              ring:
                kvstore:
                  store: inmemory
          schemaConfig:
            configs:
              - from: "2026-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          ingester:
            chunk_encoding: snappy
          limits_config:
            retention_period: 2160h
            allow_structured_metadata: true
            volume_enabled: true
          storage:
            type: s3
            bucketNames:
              chunks: loki-chunks
              ruler: loki-ruler
            s3:
              endpoint: seaweedfs-filer.seaweedfs.svc.cluster.local:8333
              region: us-east-1
              s3ForcePathStyle: true
              insecure: true
              accessKeyId: dummy
              secretAccessKey: dummy
          compactor:
            retention_enabled: true
            retention_delete_delay: 2h
            delete_request_store: s3
        singleBinary:
          replicas: 1
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        minio:
          enabled: false
        gateway:
          enabled: true
          replicas: 1
          service:
            type: ClusterIP
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - host: loki.homek8s-base.local
                paths:
                  - path: /
                    pathType: Prefix
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
