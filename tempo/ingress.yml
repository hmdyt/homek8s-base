apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tempo-otlp
  namespace: tempo
spec:
  ingressClassName: traefik
  rules:
    - host: tempo.homek8s-base.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tempo
                port:
                  number: 4318
