apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9

  master:
    replicas: 1
    volumeSizeLimitMB: 1024
    metricsPort: 9324

  volume:
    replicas: 1
    storageClassName: synology-iscsi-volume2
    requests:
      storage: 500Gi
    metricsPort: 9325

  filer:
    replicas: 1
    metricsPort: 9326
    env:
      - name: TZ
        value: Asia/Tokyo
    s3:
      enabled: true
      configSecret:
        name: seaweedfs-s3-config
        key: s3.json
    config: |
      [leveldb2]
      enabled = true
      dir = "/data/filerldb2"
    persistence:
      enabled: true
      existingClaim: seaweedfs-filer
