apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15

  master:
    replicas: 1
    volumeSizeLimitMB: 1024
    metricsPort: 9324

  volume:
    replicas: 1
    storageClassName: synology-iscsi-volume2
    requests:
      storage: 500Gi
    metricsPort: 9325

  filer:
    replicas: 1
    metricsPort: 9326
    env:
      - name: TZ
        value: Asia/Tokyo
    s3:
      enabled: true
      configSecret:
        name: seaweedfs-s3-config
        key: s3.json
    config: |
      [leveldb2]
      enabled = true
      dir = "/data/filerldb2"
    persistence:
      enabled: true
      existingClaim: seaweedfs-filer
