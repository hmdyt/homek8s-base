apiVersion: v1
kind: ConfigMap
metadata:
  name: paseo-mise-config
  namespace: paseo
data:
  config.toml: |
    [tools]
    go = "latest"
    gh = "latest"
    kubectl = "latest"
    k9s = "latest"
    python = "latest"
    jq = "latest"
    "go:code.gitea.io/tea" = "latest"  # Forgejo/Gitea CLI -> `tea` (Goビルド, cc不要)
