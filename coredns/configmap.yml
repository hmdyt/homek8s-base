apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-external-base
  namespace: dns-system
data:
  homek8s-base.corefile: |
    homek8s-base.local:53 {
        hosts {
            192.168.0.66 mimir.homek8s-base.local
            192.168.0.66 loki.homek8s-base.local
            192.168.0.66 tempo.homek8s-base.local
            fallthrough
        }
        log
        errors
    }
