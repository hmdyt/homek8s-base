# 既定の通知先を Discord にする（Grafana の既定ポリシーを丸ごと差し替える）。
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicy
metadata:
  name: default
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  route:
    receiver: discord
    group_by: ["alertname", "severity"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
