apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-discord-report
  namespace: grafana
spec:
  schedule: "0 3,9,15,21 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: alpine:latest
              env:
                - name: GRAFANA_URL
                  value: http://grafana-service.grafana.svc:3000
                - name: GRAFANA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: grafana-renderer-token
                      key: token
                - name: DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: discord-webhook
                      key: url
              command:
                - /bin/sh
                - -ec
                - |
                  apk add --no-cache curl imagemagick > /dev/null 2>&1

                  COMMON="from=now-24h&to=now&width=1800&height=600&tz=Asia%2FTokyo&theme=dark&timeout=60"
                  GLOBAL_VARS="var-datasource=mimir&var-cluster=&var-job=integrations%2Funix&var-resolution=30s"

                  render_panel() {
                    local uid="$1"
                    local panel_id="$2"
                    local name="$3"
                    local filename="$4"
                    local extra="${5:-}"

                    echo "Rendering: ${name}"
                    curl -sf --max-time 90 -H "Authorization: Bearer ${GRAFANA_TOKEN}" \
                      "${GRAFANA_URL}/render/d-solo/${uid}?panelId=${panel_id}&${COMMON}&${extra}" \
                      -o "/tmp/${filename}"
                  }

                  # Cluster-wide (k8s_views_global - requires template vars)
                  render_panel k8s_views_global 72 "Cluster CPU Utilization" "1-cluster-cpu.png" "${GLOBAL_VARS}"
                  render_panel k8s_views_global 55 "Cluster Memory Utilization" "2-cluster-mem.png" "${GLOBAL_VARS}"
                  render_panel k8s_views_global 44 "Global Network Utilization" "3-network.png" "${GLOBAL_VARS}"

                  # Per-Node (k8s-nodes-overview - no template vars needed)
                  render_panel k8s-nodes-overview 1 "CPU Usage by Node" "4-node-cpu.png"
                  render_panel k8s-nodes-overview 2 "Memory Usage by Node" "5-node-mem.png"
                  render_panel k8s-nodes-overview 4 "Disk Usage by Node" "6-node-disk.png"
                  render_panel k8s-nodes-overview 5 "Network I/O by Node" "7-node-net.png"
                  render_panel k8s-nodes-overview 3 "Load Average (1m) by Node" "8-node-load.png"

                  # Combine into a single image (2 columns x 4 rows)
                  echo "Combining images"
                  montage /tmp/1-cluster-cpu.png /tmp/2-cluster-mem.png \
                          /tmp/4-node-cpu.png /tmp/5-node-mem.png \
                          /tmp/3-network.png /tmp/7-node-net.png \
                          /tmp/6-node-disk.png /tmp/8-node-load.png \
                          -tile 2x4 -geometry 900x300+0+0 /tmp/report.png

                  echo "Sending to Discord"
                  curl -sf --max-time 30 \
                    -F "file=@/tmp/report.png" \
                    -F 'payload_json={"content":"Cluster Health Report (24h)"}' \
                    "${DISCORD_WEBHOOK_URL}"

                  echo "Done"
