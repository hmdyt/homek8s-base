apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: claude-code
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |
    {
      "title": "Claude Code",
      "uid": "claude-code-observability",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "tags": [
        "claude-code",
        "ai",
        "llm"
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Total Cost (USD, est.)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(sum_over_time({job=\"claude-code\"} | json | unwrap attributes_cost_usd [$__range]))",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "API Requests",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({job=\"claude-code\"} | json | body=\"claude_code.api_request\" [$__range]))",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 3,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Avg Latency",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "avg(avg_over_time({job=\"claude-code\"} | json | unwrap attributes_duration_ms [$__range]))",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Cache Read Tokens",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(sum_over_time({job=\"claude-code\"} | json | unwrap attributes_cache_read_tokens [$__range]))",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 9,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Cost / time by model",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (attributes_model)(sum_over_time({job=\"claude-code\"} | json | unwrap attributes_cost_usd [$__interval]))",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Requests / time by model",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (attributes_model)(count_over_time({job=\"claude-code\"} | json | body=\"claude_code.api_request\" [$__interval]))",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 6,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Latency p95 / time by model",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "max by (attributes_model)(max_over_time({job=\"claude-code\"} | json | unwrap attributes_duration_ms [$__interval]))",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 6,
            "y": 12,
            "w": 6,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "bargauge",
          "title": "Cost by model",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (attributes_model)(sum_over_time({job=\"claude-code\"} | json | unwrap attributes_cost_usd [$__range]))",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 4,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 9,
          "type": "bargauge",
          "title": "Output tokens by model",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (attributes_model)(sum_over_time({job=\"claude-code\"} | json | unwrap attributes_output_tokens [$__range]))",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 4,
            "y": 20,
            "w": 4,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 10,
          "type": "piechart",
          "title": "Request mix by model",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (attributes_model)(count_over_time({job=\"claude-code\"} | json | body=\"claude_code.api_request\" [$__range]))",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 8,
            "y": 20,
            "w": 4,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 11,
          "type": "logs",
          "title": "Recent API requests",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{job=\"claude-code\"} | json | body=\"claude_code.api_request\" | line_format \"{{.attributes_model}} ${{.attributes_cost_usd}} (in {{.attributes_input_tokens}} cache {{.attributes_cache_read_tokens}} out {{.attributes_output_tokens}}) {{.attributes_duration_ms}}ms\"",
              "refId": "A"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showTime": true,
            "dedupStrategy": "none",
            "enableLogDetails": true
          }
        }
      ]
    }
