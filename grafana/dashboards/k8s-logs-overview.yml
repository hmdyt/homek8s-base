apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: k8s-logs-overview
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |
    {
      "title": "Kubernetes Logs Overview",
      "uid": "k8s-logs-overview",
      "tags": ["kubernetes", "logs"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Log Volume by Namespace",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "mimir"},
              "expr": "namespace:log_lines_total:1m{namespace=~\"$namespace\"}",
              "refId": "A",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "axisBorderShow": false,
                "axisLabel": "lines / min"
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Error Logs by Namespace",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "mimir"},
              "expr": "namespace:log_errors_total:1m{namespace=~\"$namespace\"}",
              "refId": "A",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "axisBorderShow": false,
                "axisLabel": "errors / min"
              }
            }
          }
        },
        {
          "id": 3,
          "title": "Logs",
          "type": "logs",
          "gridPos": {"h": 16, "w": 24, "x": 0, "y": 8},
          "targets": [
            {
              "datasource": {"type": "loki", "uid": "${DS_LOKI}"},
              "expr": "{namespace=~\"$namespace\"} |~ \"$search\"",
              "refId": "A",
              "maxLines": 200
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          }
        }
      ],
      "templating": {
        "list": [
          {
            "name": "DS_LOKI",
            "type": "datasource",
            "query": "loki",
            "current": {"text": "Loki", "value": "loki"},
            "hide": 0
          },
          {
            "name": "namespace",
            "type": "query",
            "label": "Namespace",
            "datasource": {"type": "prometheus", "uid": "mimir"},
            "query": "label_values(namespace:log_lines_total:1m, namespace)",
            "refresh": 2,
            "includeAll": false,
            "multi": true,
            "sort": 1,
            "current": {}
          },
          {
            "name": "search",
            "type": "textbox",
            "label": "Search",
            "current": {"text": "", "value": ""},
            "hide": 0
          }
        ]
      }
    }
